# BACSWN SkyWatch Bahamas — Nginx reverse proxy
# Proxies to the Docker container, which listens on 127.0.0.1:8060 only.
# __DOMAIN__ is substituted by deploy/deploy.sh; certbot --nginx then adds the
# 443 server block and the HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN__;

    access_log /var/log/nginx/bacswn.access.log;
    error_log /var/log/nginx/bacswn.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket connections (JWT passed as ?token= — keep it out of access logs)
    location /ws/ {
        access_log off;
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API and all other requests
    location / {
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        client_max_body_size 10M;
    }
}
