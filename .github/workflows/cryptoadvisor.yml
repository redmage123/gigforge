name: cryptoadvisor

on:
  pull_request:
    paths:
      - 'cryptoadvisor-web/**'
      - '.github/workflows/cryptoadvisor.yml'
  push:
    branches:
      - cryptoadvisor
    paths:
      - 'cryptoadvisor-web/**'
      - '.github/workflows/cryptoadvisor.yml'

defaults:
  run:
    working-directory: cryptoadvisor-web

jobs:
  frontend:
    name: Frontend — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cryptoadvisor-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: cryptoadvisor-web/coverage/
          retention-days: 14

  cms:
    name: CMS — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryptoadvisor-web/cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cryptoadvisor-web/cms/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run

  docker-build:
    name: Docker — multi-stage build smoke
    runs-on: ubuntu-latest
    needs: [frontend, cms]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: cryptoadvisor-web
          file: cryptoadvisor-web/Dockerfile
          push: false
          load: true
          tags: cryptoadvisor-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build CMS production image
        uses: docker/build-push-action@v5
        with:
          context: cryptoadvisor-web/cms
          file: cryptoadvisor-web/cms/Dockerfile.production
          push: false
          load: true
          tags: cryptoadvisor-cms:ci-prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
