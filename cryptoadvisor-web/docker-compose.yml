
services:
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: file:/data/cms.sqlite
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-in-dev}
      PORT: "3001"
    volumes:
      - cms-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/api/assets || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CMS_URL: ${VITE_CMS_URL:-http://localhost:3001}
    ports:
      - "3000:80"
    depends_on:
      cms:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cms-data:
